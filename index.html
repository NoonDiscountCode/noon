<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="احصل على أقوى كود خصم نون ZWR لتوفير إضافي يصل إلى 80% على كافة المستلزمات.">
    
    <!-- سياسة أمان المحتوى (CSP) لحماية الصفحة -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://i.postimg.cc data:;">

    <title>أكبر عروض العام من نون | كود خصم ZWR</title>
    
    <!-- Preconnect للخطوط لتحسين السرعة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        /* Reset وتعريف الألوان الأساسية */
        :root {
            --noon-yellow: #feee00;
            --noon-yellow-hover: #e5d600;
            --text-color: #000000;
            --bg-body: #feee00;
            --card-bg: #ffffff;
            --success-green: #2e7d32;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        /* حاوية الكارت المربع */
        .card {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 620px;
            padding: 25px 20px;
            border-radius: 8px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        /* إطار الصورة لمنع الـ CLS */
        .banner-wrapper {
            width: 100%;
            aspect-ratio: 1200 / 300;
            overflow: hidden;
            border-radius: 6px;
            margin-bottom: 20px;
            background-color: #f5f5f5;
        }

        .banner-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* العناوين */
        .title {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.3;
            margin-bottom: 8px;
            color: var(--text-color);
        }

        .subtitle {
            font-size: 16px;
            font-weight: 500;
            color: #4a4a4a;
            margin-bottom: 24px;
        }

        /* مربع الكود المنقط */
        .coupon-box {
            border: 2px dashed var(--text-color);
            border-radius: 6px;
            padding: 14px 20px;
            max-width: 360px;
            margin: 0 auto 20px auto;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 3px;
            background-color: #fafafa;
            user-select: all;
            direction: ltr;
        }

        /* زر النسخ */
        .copy-btn {
            background-color: var(--noon-yellow);
            color: var(--text-color);
            border: 1.5px solid var(--text-color);
            border-radius: 50px;
            width: 100%;
            max-width: 440px;
            padding: 14px 24px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            outline: none;
        }

        .copy-btn:hover {
            background-color: var(--noon-yellow-hover);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        .copy-btn.copied {
            background-color: var(--success-green) !important;
            color: #ffffff !important;
            border-color: var(--success-green) !important;
        }

        @media (max-width: 480px) {
            .card { padding: 20px 15px; }
            .title { font-size: 22px; }
            .subtitle { font-size: 14px; }
            .coupon-box { font-size: 30px; padding: 10px 15px; }
            .copy-btn { font-size: 16px; padding: 12px 18px; }
        }
    </style>
</head>
<body>

    <main class="card">
        <div class="banner-wrapper">
            <img src="https://i.postimg.cc/XJLbHzMF/nooon.png" 
                 alt="أكبر عروض العام من نون" 
                 width="1200" 
                 height="300" 
                 fetchpriority="high"
                 decoding="async">
        </div>

        <h1 class="title">أكبر عروض العام من نون</h1>
        <p class="subtitle">خصومات حتى 80% لفترة محدودة + كود خصم إضافي</p>

        <div class="coupon-box" id="couponCode">ZWR</div>

        <button class="copy-btn" id="copyBtn" onclick="handleCopy()">اضغط هنا لنسخ الكود</button>
    </main>

    <script>
        // ضع رابط الأفلييت الخاص بك هنا لو أردت فتح المتجر تلقائياً بعد النسخ
        const REDIRECT_URL = ""; 

        function handleCopy() {
            const codeText = document.getElementById('couponCode').innerText.trim();
            const btn = document.getElementById('copyBtn');

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(codeText)
                    .then(onSuccess)
                    .catch(() => fallbackCopy(codeText));
            } else {
                fallbackCopy(codeText);
            }

            function onSuccess() {
                btn.innerText = "تم نسخ الكود بنجاح! ✅";
                btn.classList.add('copied');

                if (REDIRECT_URL) {
                    setTimeout(() => {
                        window.open(REDIRECT_URL, '_blank');
                    }, 1500);
                }

                setTimeout(() => {
                    btn.innerText = "اضغط هنا لنسخ الكود";
                    btn.classList.remove('copied');
                }, 3000);
            }

            function fallbackCopy(text) {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    const successful = document.execCommand('copy');
                    if (successful) {
                        onSuccess();
                    } else {
                        btn.innerText = "حدد الكود لنسخه يدوياً";
                    }
                } catch (err) {
                    btn.innerText = "حدد الكود لنسخه يدوياً";
                } finally {
                    document.body.removeChild(textArea);
                }
            }
        }
    </script>
</body>
</html>
